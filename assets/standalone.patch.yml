- id: llm-deepseek
  config:
    apiKeyEnv: !!js "process.env.DEEPSEEK_API_KEY_ENV ?? 'DEEPSEEK_API_KEY'"
    protocol: !!js "process.env.DEEPSEEK_PROTOCOL ?? 'messages'"
    baseURL: !!js "process.env.DEEPSEEK_BASE_URL ?? undefined"
    models: !!js "process.env.DEEPSEEK_MODELS_JSON ? JSON.parse(process.env.DEEPSEEK_MODELS_JSON) : undefined"
    thinking: enabled
    reasoningEffort: max
- id: system-prompt
  config:
    personaPrefix: You are a coding assistant powered by the {{model}} model. Verify your work by running the code or tests. Keep answers brief and factual.
    personaSuffix: Your working directory is {{cwd}}.
- id: session-persistence-jsonl
  config:
    root: !!js "process.env.DSH_SESSIONS_ROOT ?? './.sessions'"
- id: session-title-llm
  disabled: true
- id: hmr
  disabled: true
- id: session-log-deepseek
  config:
    enabled: false
- id: session-telemetry-otel
  disabled: true
- id: compaction-basic
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1
