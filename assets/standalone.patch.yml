- id: llm-deepseek
  config:
    apiKeyEnv: !!js "process.env.DEEPSEEK_API_KEY_ENV ?? 'DEEPSEEK_API_KEY'"
    protocol: !!js "process.env.DEEPSEEK_PROTOCOL ?? 'messages'"
    baseURL: !!js "process.env.DEEPSEEK_BASE_URL ?? undefined"
    models: !!js "process.env.DEEPSEEK_MODELS_JSON ? (() => { try { const parsed = JSON.parse(process.env.DEEPSEEK_MODELS_JSON); if (Array.isArray(parsed) && parsed.length > 0) { return parsed.map((m) => { const id = m.id?.toLowerCase() || ''; const isVision = id.includes('v4.1') || id.includes('vision') || (id.includes('flash') && !id.includes('v4-flash-pro')); if (isVision && (!m.inputModalities || !m.inputModalities.includes('image'))) { return { ...m, inputModalities: ['text', 'image'] }; } return m; }); } } catch {} return undefined; })() : undefined"
    thinking: enabled
    reasoningEffort: max
- id: system-prompt
  config:
    personaPrefix: You are a coding assistant powered by the {{model}} model. Verify your work by running the code or tests. Keep answers brief and factual.
    personaSuffix: Your working directory is {{cwd}}.
- id: session-persistence-jsonl
  config:
    root: !!js "process.env.DSH_SESSIONS_ROOT ?? './.sessions'"
    compression: !!js "process.env.DSH_PERSISTENCE_COMPRESSION ?? 'none'"
- id: session-title-llm
  disabled: true
- id: hmr
  disabled: true
- id: session-log-deepseek
  config:
    enabled: false
- id: session-telemetry-otel
  disabled: true
- id: compaction-basic
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1
