name: Publish Release & Sync npmmirror

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-npmmirror:
    name: Sync to Domestic npmmirror
    runs-on: ubuntu-latest
    needs: [create-release]
    steps:
      - name: Trigger npmmirror sync
        run: |
          echo "Triggering npmmirror sync for deepseek-harness-acp & dsh-acp..."
          curl -s -X PUT https://registry-direct.npmmirror.com/deepseek-harness-acp/sync || true
          curl -s -X PUT https://registry-direct.npmmirror.com/dsh-acp/sync || true
          echo "npmmirror sync triggered successfully!"
